======================  Mes annonces  ================
======================================================-->
<main class="main_class">
   <section class="annonces">
      <h1 class="section-title">Mes annonces :</h1>
      <ul class="annonces_grid"></ul>
   </section>
   <h2 id="id_h2">Publier une nouvelle annonce :</h2>
         <form action="/api/annonces/publierannonce" method="POST" enctype="multipart/form-data">

    <div class="form_group">
        <label for="titre">Titre de l'annonce :</label>
        <input type="text" name="titre" id="titre" maxlength="50" placeholder="Ex: Panneau solaire 200W" required>
    </div>

    <div class="form_group">
        <label for="categorie">Catégorie :</label>
        <input type="number" name="categorie" id="categorie" placeholder="ID de la catégorie" required>
    </div>

    <div class="form_group">
        <label for="prix">Prix (€) :</label>
        <input type="number" step="0.01" name="prix" id="prix" min="0" max="999999" placeholder="Prix en €" required>
    </div>

    <div class="form_group">
        <label for="descriptif">Description :</label>
        <textarea name="descriptif" id="descriptif" rows="5" maxlength="1000" placeholder="Décrivez votre produit en détail..." required></textarea>
    </div>

    <div class="form_group">
        <label for="photo">Photo :</label>
        <input type="file" id="photo" name="photo" accept="image/*">
    </div>

    <button type="submit" class="btn_publier">Publier l'annonce</button>
</form>
