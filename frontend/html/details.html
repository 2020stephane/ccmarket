<!doctype html>
<html lang="fr">
<!--
 * ==========================================================
 * ======================  HEAD  ============================
 * ==========================================================
-->
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Camping-Car Market - Votre spécialiste en pièces détachées pour camping-car.">
   <meta name="keywords" content="pièces détachées, camping-car, accessoires, mécanique, carrosserie">

   <link rel="icon" href="/img/favicon.ico">
   <link rel="stylesheet" href="/css/header.css">
   <link rel="stylesheet" href="/css/details.css">
   <link rel="stylesheet" href="/css/footer.css">

   <script src="/js/tools/menu_hamburger.js" defer></script>

   <title>Camping-Car Market</title>
</head>
<body>
<!--
 * ==========================================================
 * ======================  HEADER  =====================
 * ==========================================================
-->
   <header class="navbar">
      <section class="container nav-container">
         <figure>
            <img class="logo-titre" src="/img/Titre_CC_Market.png" alt="Titre Camping-Car Market">
         </figure>

         <button class="btn-hamburger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
         </button>

         <nav class="nav-links" aria-label="Navigation principale">
            <a href="index.html" class="nav-item actif" >Accueil</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Mes annonces</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Publier une annonce</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Messages</a>
            <a href="seconnecter.html" id="seconnecter" class="nav-item">Se connecter</a>
         </nav>
      </section>
   </header>
<!--
 * ==========================================================
 * ======================  MAIN  =====================
 * ==========================================================
-->
   <main class="container details-layout">
     <div class="details">
         <figure class="details-img">
            <img src="#" loading="lazy">
         </figure>

         <div class="details-content">
            <div class="details-header">
               <h3 class="details-title" id="titre"></h3>
               <p class="details-price">prix : <span id="prix"></span>€</p>
            </div>
            <div class="details-middle">
               <p class="details-meta">Catégorie : <span id="categorie"></span></p>
               <p class="details-date">Publié le : <span id="date"></span></p>
            </div>
            <p class="details-descriptif">Description : <span id="descriptif"></span></p>
         </div>

         <div class="details-button">
               <button type="button" class="btn-contact" id="btn-contact" >Contacter le vendeur</button>
         </div>
     </div>

     <!-- Fiche du vendeur (style repris de la sidebar de monCompte.html) -->
     <aside class="seller-card" id="sellerCard">
         <div class="seller-avatar" id="sellerAvatar">--</div>
         <h3 class="seller-name" id="sellerNom">Chargement…</h3>
         <p class="seller-since" id="sellerDepuis"></p>
         <hr class="seller-divider">
         <button type="button" class="btn-contact btn-seller-contact" id="btnContact">Contacter le vendeur</button>
     </aside>
     <div class="boiteContact">
          <div class="boiteContent">
          <label for="message">Votre message :</label>
          <textarea id="message" name="message" rows="5">
          </textarea>
          <button id="btnEnregistrer">Enregistrer</button>
          <button id="btnAnnuler">Annuler</button>
          </div>
     </div>
   </main>
<!--
 * ==========================================================
 * ======================  FOOTER  =====================
 * ==========================================================
-->
   <footer class="main-footer">
      <nav class="footer-links">
         <a href="contact.html">Contact</a>
         <a href="mentions_legales.html">Mentions légales</a>
      </nav>
      <div class="footer-copyright">
         2026 Camping-Car Market - Projet Professionnel BTS Web.
      </div>
   </footer>
   <script type="module" src="/js/details.js"></script>
</body>
</html>
