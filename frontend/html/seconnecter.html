<!doctype html>
<html lang="fr">
<!--
 * ==========================================================
 * ======================  HEAD  ============================
 * ==========================================================
-->

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Camping-Car Market - Votre spécialiste en pièces détachées pour camping-car.">
   <meta name="keywords" content="pièces détachées, camping-car, accessoires, mécanique, carrosserie">

   <link rel="icon" href="/img/favicon.ico">
   <link rel="stylesheet" href="/css/header.css">
   <link rel="stylesheet" href="/css/seconnecter.css">
   <link rel="stylesheet" href="/css/footer.css">

   <script src="/js/tools/menu_hamburger.js" defer></script>

   <title>Camping-Car Market</title>
</head>

<body>
<!--
 * ==========================================================
 * ======================  HEADER  =====================
 * ==========================================================
-->
   <header class="navbar">
      <section class="container nav-container">
         <figure>
            <img class="logo-titre" src="/img/Titre_CC_Market.png" alt="Titre Camping-Car Market">
         </figure>

         <button class="btn-hamburger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
         </button>

         <nav class="nav-links" aria-label="Navigation principale">
            <a href="index.html" class="nav-item">Accueil</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Mes annonces</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Publier une annonce</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Messages</a>
            <a href="seconnecter.html" id="seconnecter" class="nav-item actif">Se connecter</a>
         </nav>
      </section>
   </header>
<!--
 * ==========================================================
 * ======================  MAIN  ============================
 * ==========================================================
-->

   <main>
      <section class="hero">
         <section class="c_standard">
            <h1>CONNEXION</h1>
            <form action="#" id="formConnection">
               <p>
                  <label for="email">Email* :</label>
                  <input type="email" id="email" name="email" autocomplete="email"
                     placeholder="Email" required>
               </p>

               <p>
                  <label for="password">Mot de passe* :</label>
                  <input type="password" id="password" name="password" autocomplete="current-password"
                     placeholder="Mot de passe" required>
               </p>
               <p class="champ-checkbox">
                    <input type="checkbox" id="rester" name="rester">
                    <label for="rester">rester connecter</label>
               </p>
               <button id="b_submit" type="submit">CONNEXION</button>

               <p>Pas encore de compte ? <a href="inscription.html">S'inscrire</a></p>
            </form>
         </section>

         <div class="separator">ou</div>

         <section class="c_google">
            <div id="g_id_onload"
               data-client_id="704222357776-o9n7aic7rf37p2dp5d50pfd8a3lrkk3n.apps.googleusercontent.com"
               data-context="signin"
               data-ux_mode="popup"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
            </div>

            <div class="g_id_signin"
               data-type="standard"
               data-shape="rectangular"
               data-theme="outline"
               data-text="signin_with"
               data-size="large"
               data-logo_alignment="left">
            </div>

         </section>
      </section>
   </main>
<!--
 * ==========================================================
 * ======================  FOOTER  =====================
 * ==========================================================
-->

   <footer class="main-footer">
      <nav class="footer-links">
         <a href="contact.html">Contact</a>
         <a href="mentions_legales.html">Mentions légales</a>
      </nav>
      <div class="footer-copyright">
         2026 Camping-Car Market - Projet Professionnel BTS Web.
      </div>
   </footer>
   <script src="https://accounts.google.com/gsi/client"></script>
   <script type="module" src="/js/seconnecter.js"></script>
</body>
</html>
