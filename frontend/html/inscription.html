<head>
   <meta charset="UTF-8">

   <meta name="description" content="Camping-Car Market - Votre spécialiste en pièces détachées pour camping-car.">

   <link rel="icon" href="/img/favicon.ico">
   <link rel="stylesheet" href="/css/header.css">
   <link rel="stylesheet" href="/css/inscription.css">
   <link rel="stylesheet" href="/css/footer.css">

   <script src="/js/tools/menu_hamburger.js" defer></script>

   <title>Camping-Car Market</title>
</head>

<body>
<!--
 * ==========================================================
 * ======================  HEADER  =====================
 * ==========================================================
-->
   <header class="navbar">
      <section class="container nav-container">
         <figure>
            <img class="logo-titre" src="/img/Titre_CC_Market.png" alt="Titre Camping-Car Market">
         </figure>

         <button class="btn-hamburger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
         </button>

         <nav class="nav-links" aria-label="Navigation principale">
            <a href="index.html" class="nav-item" >Accueil</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Mes annonces</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Publier une annonce</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Messages</a>
            <a href="seconnecter.html" id="seconnecter" class="nav-item actif">Se connecter</a>
         </nav>
      </section>
   </header>
   <!--==================================================
======================  HERO  ========================
===================================================-->
   <section class="hero">
      <h1>Créer un compte</h1>
      <form id="formInscription">
         <p>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" required>
         </p>

         <p>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" required>
         </p>

         <p>
            <label for="email">e-mail :</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
         </p>

         <p>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
         </p>

         <button id="b_submit" type="submit">S'inscrire</button>
      </form>
      <p>Déjà un compte ? <a href="connection.html">Se connecter</a></p>
      <p id="msg-erreur"></p>
   </section>
<!--
