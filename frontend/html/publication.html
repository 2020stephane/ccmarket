<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Camping-Car Market - Votre spécialiste en pièces détachées pour camping-car.">
   <meta name="keywords" content="pièces détachées, camping-car, accessoires, mécanique, carrosserie">

   <link rel="icon" href="/img/favicon.ico">
   <link rel="stylesheet" href="/css/header.css">
   <link rel="stylesheet" href="/css/publication.css">
   <link rel="stylesheet" href="/css/footer.css">

   <script src="/js/tools/menu_hamburger.js" defer></script>

   <title>Camping-Car Market</title>
</head>

<body>
<!--
 * ==========================================================
 * ======================  HEADER  =====================
 * ==========================================================
-->
   <header class="navbar">
      <section class="container nav-container">
         <figure>
            <img class="logo-titre" src="/img/Titre_CC_Market.png" alt="Titre Camping-Car Market">
         </figure>

         <button class="btn-hamburger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
         </button>

         <nav class="nav-links" aria-label="Navigation principale">
            <a href="index.html" class="nav-item" >Accueil</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Mes annonces</a>
            <a href="#" class="disabled nav-item actif" aria-disabled="true" tabindex="-1">Publier une annonce</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Messages</a>
            <a href="seconnecter.html" id="seconnecter" class="nav-item">Se connecter</a>
         </nav>
      </section>
   </header>
<!--
 * ==========================================================
 * ======================  MAIN  =====================
 * ==========================================================
-->
     <main>
          <section class="hero"></section>
          <h1>Publier une annonce</h1>
          <div id="formPublier">
          <form enctype="multipart/form-data">

            <div class="form_group">
               <label for="titre">Titre de l'annonce :</label>
               <input type="text" name="titre" id="titre" maxlength="50" placeholder="Ex: Panneau solaire 200W" required>
            </div>

            <div class="form_group">
               <label for="categorie">Catégorie :</label>
               <select type="number" name="categorie" id="categorie" placeholder="ID de la catégorie" required>
                  <option value="">-- Choisissez une catégorie --</option>
                  <option value="1">Mobilier intérieur</option>
                  <option value="2">Énergie solaire</option>
                  <option value="3">Cuisine & Électroménage</option>
                  <option value="4">Sanitaire & Eau</option>
                  <option value="5">Literie & Confort</option>
                  <option value="6">Électronique & Navigation</option>
                  <option value="7">Extérieur & Auvent</option>
               </select>
            </div>

            <div class="form_group">
               <label for="prix">Prix (€) :</label>
               <input type="number" step="1" name="prix" id="prix" min="0" max="999999" placeholder="Prix en €" required>
            </div>

            <div class="form_group">
               <label for="descriptif">Description :</label>
               <textarea name="descriptif" id="descriptif" rows="5" maxlength="1000" placeholder="Décrivez votre produit en détail..." required></textarea>
            </div>

            <div class="form_group">
               <label for="inputphoto">Photo :</label>
               <div class="file-upload">
                  <input type="file" id="inputphoto" name="photo" accept="image/*">
                  <label for="inputphoto" class="btn-file">Choisir une photo</label>
                  <span id="file-nom">Aucun fichier choisi</span>
               </div>
            </div>

            <button type="submit" id="btn_publier">Publier l'annonce</button>
         </form>
       </div>
     </main>
<!--

</body>
</html>
