<!doctype html>
<html lang="fr">
<!--
 * ==========================================================
 * ======================  HEAD  =====================
 * ==========================================================
-->
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="Camping-Car Market - Votre spécialiste en pièces détachées pour camping-car.">
   <meta name="keywords" content="pièces détachées, camping-car, accessoires, mécanique, carrosserie">

   <link rel="icon" href="/img/favicon.ico">
   <link rel="stylesheet" href="/css/header.css">
   <link rel="stylesheet" href="/css/contact.css">
   <link rel="stylesheet" href="/css/footer.css">

   <script src="/js/tools/menu_hamburger.js" defer></script>

   <title>Camping-Car Market</title>
</head>

<body>
<!--
 * ==========================================================
 * ======================  HEADER  =====================
 * ==========================================================
-->
   <header class="navbar">
      <section class="container nav-container">
         <figure>
            <img class="logo-titre" src="/img/Titre_CC_Market.png" alt="Titre Camping-Car Market">
         </figure>

         <button class="btn-hamburger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-menu">
            <span></span>
            <span></span>
            <span></span>
         </button>

         <nav class="nav-links" aria-label="Navigation principale">
            <a href="index.html" class="nav-item" >Accueil</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Mes annonces</a>
            <a href="#" class="disabled nav-item" aria-disabled="true" tabindex="-1">Messages</a>
            <a href="seconnecter.html" id="seconnecter" class="nav-item">Se connecter</a>
         </nav>
      </section>
   </header>
<!--
 * ==========================================================
 * ======================  MAIN  =====================
 * ==========================================================
-->
   <main>
      <h1>Contacter Camping-Car Market</h1>
      <form id="formContact" aria-labelledby="form-titre">

         <div class="form-group">
            <label for="prenom_id">Prénom :</label>
            <input type="text" id="prenom_id" name="prenom" autocomplete="prenom"
               placeholder="Prénom" required>
         </div>

         <div class="form-group">
            <label for="nom_id">Nom :</label>
            <input type="text" id="nom_id" name="nom" autocomplete="nom"
               placeholder="Nom" required>
         </div>

         <div class="form-group">
            <label for="email_id">e-mail :</label>
            <input type="email" id="email_id" name="email" autocomplete="email"
               placeholder="email" required>
         </div>

         <div class="form-group">
            <label for="message_id">Votre message <span class="hint">(250 caractères max)</span>:</label>
            <textarea id="message_id" name="message" rows="6" cols="40"
               maxlength="250" aria-describedby="message-compteur"
               placeholder="Écrivez votre message ici..."></textarea>
               <span id="message-compteur" aria-live="polite">0 / 250</span>
         </div>

         <button type="submit" id="b_submit">ENVOYER</button>
         <p id="msg-erreur" role="alert" aria-live="polite"></p>

      </form>
   </main>
<!--
 * ==========================================================
 * ======================  FOOTER  =====================
 * ==========================================================
-->
   <footer class="main-footer">
      <nav class="footer-links">
         <a href="contact.html">Contact</a>
         <a href="mentions_legales.html">Mentions légales</a>
      </nav>
      <div class="footer-copyright">
         2026 Camping-Car Market - Projet Professionnel BTS Web.
      </div>
   </footer>
   <script type="module" src="/js/contact.js"></script>
</body>

</html>
